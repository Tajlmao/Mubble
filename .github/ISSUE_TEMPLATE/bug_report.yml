name: Bug report
description: Report a reproducible problem in Mubble.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the selected layer, product, source timestamp, and steps to reproduce.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: For example, Chrome on Android or Safari on iPhone.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or errors
      description: Remove credentials and personal information. Report security vulnerabilities privately using SECURITY.md.
