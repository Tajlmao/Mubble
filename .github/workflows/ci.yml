name: Mubble checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mubble-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-weather.txt
      - name: Install locked dependencies and build
        run: bash scripts/setup.sh
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Verify production server
        shell: bash
        run: |
          set -euo pipefail
          npm start > "$RUNNER_TEMP/mubble-server.log" 2>&1 &
          mubble_server_pid=$!
          trap 'kill "$mubble_server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 --max-time 10 http://127.0.0.1:3000/ -o "$RUNNER_TEMP/mubble-page.html"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; assert.match(readFileSync(process.argv[1], "utf8"), /Mubble — Weather &amp; Earth/)' "$RUNNER_TEMP/mubble-page.html"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/cesium/Cesium.js -o /dev/null
